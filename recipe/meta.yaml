{% set name = "streamlit-chat" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e5911c8e3d5bbdd444782a0eb46a5f0cf24247124eb165bcc2e759540767ac3c

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<36]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - streamlit >=0.63

test:
  imports:
    - streamlit_chat
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://github.com/AI-Yash/st-chat
  dev_url: https://github.com/AI-Yash/st-chat
  doc_url: https://github.com/AI-Yash/st-chat/blob/main/README.md
  summary: A streamlit component, to make chatbots
  description: |
    Streamlit Component, for a Chat-bot UI
  license: MIT
  license_file: LICENSE
  license_family: MIT

extra:
  recipe-maintainers:
    - ELundby45
